[build]
  command = "pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/terms"
  to = "/docs/enigma-standard-terms-and-conditions.pdf"
  status = 302
  force = true

[[headers]]
  for = "/docs/enigma-standard-terms-and-conditions.pdf"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
